name: Dockstring Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

steps:
    - uses: actions/checkout@v7

    - name: Set up Python (3.13)
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install dependencies (not in editable mode)
      run: |
        python -m pip install .[dev]

    - name: Run Pre-commit Checks for Eversy File
      run: |
        pre-commit run --all-files
