name: Pre-commit checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python (3.13)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies (not in editable mode)
        run: python -m pip install ".[dev]"

      - name: Run pre-commit checks for every file
        run: pre-commit run --all-files
